<article
  class="flex h-full animate-pulse flex-col overflow-hidden rounded-2xl bg-surface shadow-sm ring-1 ring-primary-100"
  aria-hidden="true">

  <div class="grid aspect-video w-full place-items-center bg-primary-100">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
      class="h-12 w-12 text-primary-300">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
    </svg>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-4 sm:p-5">

    <div class="flex h-4 items-center">
      <div class="h-3 w-32 rounded-full bg-primary-200"></div>
    </div>

    <div class="flex flex-col">
      <div class="flex h-[1.55rem] items-center sm:h-[1.72rem]">
        <div class="h-4 w-full rounded-full bg-primary-200 sm:h-5"></div>
      </div>
      <div class="flex h-[1.55rem] items-center sm:h-[1.72rem]">
        <div class="h-4 w-2/3 rounded-full bg-primary-200 sm:h-5"></div>
      </div>
    </div>

    <div class="flex flex-col">
      @for (width of summaryLines; track $index) {
        <div class="flex h-[1.42rem] items-center sm:h-[1.625rem]">
          <div class="h-2.5 rounded-full bg-primary-100 sm:h-3" [class]="width"></div>
        </div>
      }
    </div>

    <div class="mt-auto flex flex-wrap gap-2 pt-2">
      <div class="h-6 w-16 rounded-full bg-primary-100"></div>
      <div class="h-6 w-20 rounded-full bg-primary-100"></div>
      <div class="h-6 w-12 rounded-full bg-primary-100"></div>
    </div>
  </div>
</article>
